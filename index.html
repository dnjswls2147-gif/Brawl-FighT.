<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>브롤 파이트 (Brawl Fight)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }
        /* 화면 공통 컨테이너 */
        .game-container {
            width: 400px;
            background: #fff;
            border: 4px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        /* 로비 화면 스타일 */
        #lobbyScreen {
            padding: 40px 20px;
            text-align: center;
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 520px;
        }
        #lobbyScreen h1 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #ffeb3b;
            text-shadow: 2px 2px #000;
        }
        .lobby-btn {
            width: 80%;
            padding: 15px;
            margin: 10px 0;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px rgba(0,0,0,0.3);
            transition: 0.1s;
        }
        .select-btn {
            background-color: #ff9800;
            color: white;
        }
        .start-btn {
            background-color: #4caf50;
            color: white;
        }
        .lobby-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 rgba(0,0,0,0.3);
        }
        /* 게임 플레이 화면 */
        #gameScreen {
            display: none;
            flex-direction: column;
        }
        #gameCanvas {
            background: #ffffff;
            display: block;
        }
        .control-panel {
            background: #f0f0f0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 3px solid #ccc;
        }
        .player-status-group {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .status-box {
            flex: 1;
            background: #fff;
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #ddd;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .status-name {
            font-size: 13px;
            font-weight: bold;
            color: #d32f2f;
            text-align: center;
        }
        .status-name.p2 {
            color: #1976d2;
        }
        .bar-container {
            width: 100%;
            height: 16px;
            background: #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            border: 1px solid #bbb;
        }
        .hp-fill {
            height: 100%;
            background: #4caf50;
            width: 100%;
            transition: width 0.1s linear;
        }
        .hp-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            font-size: 10px;
            font-weight: bold;
            color: black;
            text-align: center;
            line-height: 14px;
        }
        .skill-bar-container {
            width: 100%;
            height: 12px;
            background: #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            border: 1px solid #bbb;
        }
        .skill-fill {
            height: 100%;
            background: #9c27b0;
            width: 0%;
            transition: width 0.1s linear;
        }
        .skill-text {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            font-size: 9px;
            font-weight: bold;
            color: white;
            text-align: center;
            line-height: 10px;
            text-shadow: 0 1px 1px rgba(0,0,0,0.7);
        }
        .exit-btn {
            background: #e53935;
            color: white;
            border: none;
            padding: 10px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px #c62828;
            transition: all 0.1s;
        }
        .exit-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 #c62828;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- 1. 로비 화면 -->
    <div id="lobbyScreen">
        <h1>BRAWL FIGHT</h1>
        <p style="margin-bottom: 30px; font-size: 14px; color: #ddd;">쉘리공 vs 니타공의 대결!</p>
        <button class="lobby-btn select-btn" onclick="openSelector()">선택하기</button>
        <button class="lobby-btn start-btn" onclick="startGame()">시작하기</button>
    </div>

    <!-- 2. 게임 플레이 화면 -->
    <div id="gameScreen">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="control-panel">
            <div class="player-status-group">
                <!-- 쉘리 (P1) -->
                <div class="status-box">
                    <div class="status-name">쉘리공</div>
                    <div class="bar-container">
                        <div id="p1HpFill" class="hp-fill"></div>
                        <div id="p1HpText" class="hp-text">1000 / 1000</div>
                    </div>
                    <div class="skill-bar-container">
                        <div id="p1SkillFill" class="skill-fill"></div>
                        <div id="p1SkillText" class="skill-text">자동 충전중</div>
                    </div>
                </div>
                <!-- 니타 (P2) -->
                <div class="status-box">
                    <div class="status-name p2">니타공</div>
                    <div class="bar-container">
                        <div id="p2HpFill" class="hp-fill" style="background:#2196f3;"></div>
                        <div id="p2HpText" class="hp-text">1000 / 1000</div>
                    </div>
                    <div class="skill-bar-container">
                        <div id="p2SkillFill" class="skill-fill"></div>
                        <div id="p2SkillText" class="skill-text">자동 충전중</div>
                    </div>
                </div>
            </div>
            <button class="exit-btn" onclick="returnToLobby()">나가기 🚪</button>
        </div>
    </div>
</div>

<script>
    const lobbyScreen = document.getElementById('lobbyScreen');
    const gameScreen = document.getElementById('gameScreen');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'shelly_shot') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
            gainNode.gain.setValueAtTime(0.5, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'nita_shock') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
            gainNode.gain.setValueAtTime(0.6, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'hit') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        }
    }

    // 이미지 설정 (2번째 사진: 쉘리, 3번째 사진: 니타)[span_3](start_span)[span_3](end_span)[span_4](start_span)[span_4](end_span)
    const shellyImg = new Image();
    shellyImg.src = 'https://i.imgur.com/83U8uQn.png'; 

    const nitaImg = new Image();
    nitaImg.src = 'https://i.imgur.com/G5qWv4L.png'; 

    const p1 = {
        x: 100, y: 200, radius: 28, hp: 1000, maxHp: 1000,
        skillCharge: 0, maxSkillCharge: 100,
        vx: 2.2, vy: 1.8, color: '#d32f2f'
    };

    const p2 = {
        x: 300, y: 200, radius: 28, hp: 1000, maxHp: 1000,
        skillCharge: 0, maxSkillCharge: 100,
        vx: -2.0, vy: 2.2, color: '#1976d2'
    };

    let projectiles = [];
    let waves = [];
    let gameRunning = false;

    function openSelector() {
        alert("쉘리공과 니타공이 기본 선택되어 있습니다!");
    }

    function startGame() {
        initAudio();
        lobbyScreen.style.display = 'none';
        gameScreen.style.display = 'flex';
        p1.hp = 1000; p2.hp = 1000;
        p1.x = 100; p1.y = 200;
        p2.x = 300; p2.y = 200;
        projectiles = [];
        waves = [];
        gameRunning = true;
    }

    function returnToLobby() {
        gameRunning = false;
        gameScreen.style.display = 'none';
        lobbyScreen.style.display = 'flex';
    }

    function update() {
        if (!gameRunning) return;

        p1.x += p1.vx;
        p1.y += p1.vy;
        p2.x += p2.vx;
        p2.y += p2.vy;

        // 벽 충돌
        [p1, p2].forEach(p => {
            if (p.x - p.radius < 0) { p.x = p.radius; p.vx *= -1; }
            if (p.x + p.radius > canvas.width) { p.x = canvas.width - p.radius; p.vx *= -1; }
            if (p.y - p.radius < 0) { p.y = p.radius; p.vy *= -1; }
            if (p.y + p.radius > canvas.height) { p.y = canvas.height - p.radius; p.vy *= -1; }
        });

        // 공끼리 부딪힐 때 (데미지 없음)
        const dx = p1.x - p2.x;
        const dy = p1.y - p2.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < p1.radius + p2.radius) {
            let tempVx = p1.vx;
            let tempVy = p1.vy;
            p1.vx = p2.vx;
            p1.vy = p2.vy;
            p2.vx = tempVx;
            p2.vy = tempVy;

            const overlap = (p1.radius + p2.radius) - dist;
            const angle = Math.atan2(dy, dx);
            p1.x += Math.cos(angle) * overlap / 2;
            p1.y += Math.sin(angle) * overlap / 2;
            p2.x -= Math.cos(angle) * overlap / 2;
            p2.y -= Math.sin(angle) * overlap / 2;
        }

        // 스킬 자동 충전 및 자동 발동 로직
        if (p1.skillCharge < p1.maxSkillCharge) {
            p1.skillCharge += 0.5;
        } else {
            // 쉘리 자동 스킬 발동 (산탄 발사)
            p1.skillCharge = 0;
            playSound('shelly_shot');
            for (let i = -2; i <= 2; i++) {
                const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x) + (i * 0.15);
                projectiles.push({
                    x: p1.x, y: p1.y,
                    vx: Math.cos(angle) * 6,
                    vy: Math.sin(angle) * 6,
                    radius: 6, owner: 'p1', damage: 120
                });
            }
        }

        if (p2.skillCharge < p2.maxSkillCharge) {
            p2.skillCharge += 0.4;
        } else {
            // 니타 자동 스킬 발동 (충격파)
            p2.skillCharge = 0;
            playSound('nita_shock');
            waves.push({
                x: p2.x, y: p2.y,
                radius: 10, maxRadius: 110,
                owner: 'p2', damage: 160
            });
        }

        // 탄환 업데이트
        projectiles.forEach((proj, index) => {
            proj.x += proj.vx;
            proj.y += proj.vy;

            if (proj.owner === 'p1') {
                const pd = Math.sqrt((proj.x - p2.x)**2 + (proj.y - p2.y)**2);
                if (pd < p2.radius + proj.radius) {
                    p2.hp = Math.max(0, p2.hp - proj.damage);
                    playSound('hit');
                    projectiles.splice(index, 1);
                }
            }

            if (proj.x < 0 || proj.x > canvas.width || proj.y < 0 || proj.y > canvas.height) {
                projectiles.splice(index, 1);
            }
        });

        // 충격파 업데이트
        waves.forEach((wave, index) => {
            wave.radius += 3.5;
            const wd = Math.sqrt((wave.x - p1.x)**2 + (wave.y - p1.y)**2);
            if (wd <= wave.radius + p1.radius && wd >= wave.radius - p1.radius - 12) {
                if (!wave.hitDone) {
                    p1.hp = Math.max(0, p1.hp - wave.damage);
                    playSound('hit');
                    wave.hitDone = true;
                }
            }
            if (wave.radius > wave.maxRadius) {
                waves.splice(index, 1);
            }
        });

        // 게임 종료 체크
        if (p1.hp <= 0 || p2.hp <= 0) {
            alert(p1.hp <= 0 ? "니타공 승리!" : "쉘리공 승리!");
            returnToLobby();
        }

        // UI 갱신
        document.getElementById('p1HpFill').style.width = (p1.hp / p1.maxHp * 100) + '%';
        document.getElementById('p1HpText').innerText = `${Math.floor(p1.hp)} / ${p1.maxHp}`;
        document.getElementById('p1SkillFill').style.width = (p1.skillCharge / p1.maxSkillCharge * 100) + '%';

        document.getElementById('p2HpFill').style.width = (p2.hp / p2.maxHp * 100) + '%';
        document.getElementById('p2HpText').innerText = `${Math.floor(p2.hp)} / ${p2.maxHp}`;
        document.getElementById('p2SkillFill').style.width = (p2.skillCharge / p2.maxSkillCharge * 100) + '%';
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 네모난 그리드 배경을 없애고 깨끗하고 선명한 경기장 배경 적용[span_5](start_span)[span_5](end_span)
        ctx.fillStyle = '#fafafa';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 테두리 강조
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 3;
        ctx.strokeRect(0, 0, canvas.width, canvas.height);

        // 쉘리공 그리기
        ctx.save();
        ctx.beginPath();
        ctx.arc(p1.x, p1.y, p1.radius, 0, Math.PI * 2);
        ctx.lineWidth = 4;
        ctx.strokeStyle = p1.color;
        ctx.stroke();
        ctx.clip();
        if (shellyImg.complete) {
            ctx.drawImage(shellyImg, p1.x - p1.radius, p1.y - p1.radius, p1.radius * 2, p1.radius * 2);
        }
        ctx.restore();

        // 니타공 그리기
        ctx.save();
        ctx.beginPath();
        ctx.arc(p2.x, p2.y, p2.radius, 0, Math.PI * 2);
        ctx.lineWidth = 4;
        ctx.strokeStyle = p2.color;
        ctx.stroke();
        ctx.clip();
        if (nitaImg.complete) {
            ctx.drawImage(nitaImg, p2.x - p2.radius, p2.y - p2.radius, p2.radius * 2, p2.radius * 2);
        }
        ctx.restore();

        // 쉘리 샷건 탄환
        projectiles.forEach(proj => {
            ctx.beginPath();
            ctx.arc(proj.x, proj.y, proj.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ff9800';
            ctx.fill();
            ctx.closePath();
        });

        // 니타 충격파
        waves.forEach(wave => {
            ctx.beginPath();
            ctx.arc(wave.x, wave.y, wave.radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(33, 150, 243, 0.7)';
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.closePath();
        });
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
